          return `<div class="chat-head">
      <div class="s-tabs" role="tablist" aria-label="Open chats">
        ${S.draftNew ? '<button class="s-tab" role="tab" aria-selected="true"><span>New chat</span></button>' : ''}
        ${tabs.map((s) => `<button class="s-tab" role="tab" data-session="${s.id}" aria-selected="${s.id === S.activeSession}" title="${esc(s.title)}"><span>${esc(s.title)}</span><span class="x" data-close-tab="${s.id}" role="button" aria-label="Close ${esc(s.title)}">${ico.x}</span></button>`).join('')}
      </div>
      ${others.length ? `<button class="btn" data-more-sessions title="Older chats">${others.length} more ${ico.down}</button>` : ''}
      <button class="btn btn-icon" data-new-session aria-label="New chat" title="New chat">${ico.plus}</button>
    </div>
    <div class="chat-body" data-chat-scroll>${sess ? `<div style="margin-bottom:12px">${placeHTML(sess.place)}</div>` : ''}${logHTML(sess)}</div>`;
        },
        more(anchor) {

            (s) => !this.open.includes(s.id),
          );
          openPop(
            anchor,
            `<div class="pop-body" style="padding:0;gap:2px">${others.map((s) => `<button class="pop-item" data-pick="${s.id}" style="height:auto;padding:8px 10px;display:grid;gap:2px"><span style="font-weight:500">${esc(s.title)}</span><span class="place">${placeLabel(s.place).icon}<span>${esc(placeLabel(s.place).label)} · ${ago(s.updated)}</span></span></button>`).join('')}</div>`,
            (e) => {
              const b = e.target.closest('[data-pick]');
              if (b) {
                closePop();
                S.draftNew = false;
                S.activeSession = b.dataset.pick;
                refreshChat();

            },
          );
        },
      };

      /* ---------- Variant B · History: every chat listed beside the conversation ---------- */
      const HISTORY = {
        wide: true,
        enter() {

          if (!S.activeSession) S.draftNew = true;
        },

          const list = sortedSessions().filter(
            (s) =>

          const groups = [
            ['Today', (s) => NOW - s.updated < DAY],

        ${groups
          .map(([g, fn]) => {
            const items = list.filter(fn);
            return items.length
              ? `<p class="hist-group">${g}</p>${items.map((s) => `<button class="hist-item" data-session="${s.id}" aria-current="${s.id === S.activeSession}"><b>${esc(s.title)}</b>${placeHTML(s.place)}</button>`).join('')}`
              : '';
          })

      </nav>
      <div class="hist-main">
        <div class="hist-title">${sess ? `<b>${esc(sess.title)}</b>${placeHTML(sess.place)}<span class="muted" style="margin-left:auto;font-size:12px;white-space:nowrap">${ago(sess.updated)}</span>` : '<b>New chat</b>'}</div>
        <div class="chat-body" data-chat-scroll>${logHTML(sess)}</div>
      </div>
    </div>`;
        },
      };

      /* ---------- Variant C · Per place: chats belong to where you are ---------- */
      const PLACE = {
        enter() {
          const here = sortedSessions().filter((s) => s.place === placeOf());
          S.activeSession = here[0]?.id || null;
          S.draftNew = !here.length;
        },
        chatHTML() {
          const here = placeOf();
          const sess = session();
          const l = placeLabel(here);
          const count = SESSIONS.filter((s) => s.place === here).length;
          const where = S.page === 'studio' ? 'on this canvas' : 'here';
          const elsewhere = sess && sess.place !== here;
          return `<div class="chat-head">
      <button class="place-btn" data-place-menu aria-haspopup="menu" title="Switch chat">${ico.spark}<b>${sess ? esc(sess.title) : 'New chat'}</b>${ico.down}</button>
      <span class="place">${l.icon}<span>${count ? `${plural(count, 'chat')} ${where}` : `No chats ${where} yet`}</span></span>
      <button class="btn btn-icon" style="margin-left:auto" data-new-session aria-label="New chat here" title="New chat here">${ico.plus}</button>
    </div>
    <div class="chat-body" data-chat-scroll>
      ${elsewhere ? `<div class="elsewhere">${placeLabel(sess.place).icon}<span>This chat started in <b>${esc(placeLabel(sess.place).label)}</b>.</span><button class="btn btn-soft" data-goto-place="${sess.place}">Go there</button></div>` : ''}
      ${logHTML(sess, S.page === 'studio' ? `Chats here are about “${esc(l.label)}”. Mado can see this board and your whole library.` : `Chats here are about ${esc(l.label === 'Library' ? 'your whole library' : `“${l.label}”`)}.`)}
    </div>`;
        },
        menu(anchor) {
          const here = placeOf();

          const rest = sortedSessions().filter((s) => s.place !== here);
          const item = (s) =>
            `<button class="pop-item" data-pick="${s.id}" ${s.id === S.activeSession ? 'aria-current="true"' : ''} style="height:auto;padding:8px 10px;display:grid;gap:2px"><span style="font-weight:500">${esc(s.title)}</span><span class="place">${placeLabel(s.place).icon}<span>${esc(placeLabel(s.place).label)} · ${ago(s.updated)}</span></span></button>`;
          openPop(
            anchor,
            `<div class="pop-body" style="padding:0;gap:2px">
      <p class="pop-section">${S.page === 'studio' ? 'On this canvas' : `In ${esc(placeLabel(here).label)}`}</p>
      ${mine.length ? mine.map(item).join('') : '<p class="pop-help" style="padding:4px 10px">None yet.</p>'}
      <button class="pop-item" data-pick="new">${ico.plusSm}<span>New chat here</span></button>
      ${rest.length ? `<p class="pop-section" style="margin-top:8px">Elsewhere</p>${rest.map(item).join('')}` : ''}
    </div>`,
            (e) => {
              const b = e.target.closest('[data-pick]');
              if (!b) return;
              closePop();
              if (b.dataset.pick === 'new') newSession();

              }

        },
      };

      /* =====================================================================
   Popovers, filter builder, overlays, board
   ===================================================================== */
      let pop = null;
      function placePop(el, anchor) {
        const r = anchor.getBoundingClientRect();
        const w = el.offsetWidth,
          h = el.offsetHeight;
        const left = Math.min(Math.max(16, r.left), innerWidth - w - 16);
        const below = innerHeight - r.bottom > h + 16 || r.top < h + 16;
        el.style.left = `${left}px`;
        el.style.top = below
          ? `${r.bottom + 8}px`
          : `${Math.max(16, r.top - h - 8)}px`;
        el.style.transformOrigin = `${r.left + r.width / 2 - left}px ${below ? 'top' : 'bottom'}`;
      }
      function openPop(anchor, html, onClick, onSubmit) {
        closePop();
        const el = document.createElement('div');
        el.className = 'pop';
        el.setAttribute('role', 'dialog');
        el.innerHTML = html;
        document.body.append(el);
        placePop(el, anchor);
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          onClick(e, el);
        });
        el.addEventListener('submit', (e) => {
          e.preventDefault();
          onSubmit?.(e, el);
        });
        pop = { el, anchor };
        if (!('ontouchstart' in window))
          (
            el.querySelector('[aria-selected="true"]') ||
            el.querySelector('button, input')
          )?.focus();
      }
      function closePop(restore = false) {
        if (!pop) return;
        const a = pop.anchor;
        pop.el.remove();
        pop = null;
        if (restore && a.isConnected) a.focus();
      }

      const unitOptions = (sel) =>
        ['day', 'week', 'month', 'year']
          .map(
            (u) =>
              `<option value="${u}" ${u === sel ? 'selected' : ''}>${u}s</option>`,
          )
          .join('');
      function treeItems(pid, depth) {
        return children(pid)
          .map(
            (c) =>
              `<button class="pop-item" data-col="${c.id}" style="padding-left:${10 + depth * 16}px"><span class="dot" style="background:${dotColor(c)}"></span><span>${esc(c.name)}</span><span class="count num">${countIn(c.id)}</span></button>${treeItems(c.id, depth + 1)}`,
          )
          .join('');
      }
      function openBuilder(anchor, { tab = 'type', filter = null, onApply }) {
        let active = filter
          ? filter.kind === 'col'
            ? 'collection'
            : filter.kind
          : tab;
        const kindsOn = new Set(
          filter?.kind === 'type'
            ? filter.kinds
            : S.filters.find((f) => f.kind === 'type')?.kinds || [],
        );
        const body = () => {
          if (active === 'type')
            return `<div><p class="pop-label">Show only</p><div class="type-grid">${Object.keys(
              KIND_LABEL,
            )
              .map(
                (k) =>
                  `<button class="pop-item" data-kind="${k}" aria-pressed="${kindsOn.has(k)}">${KIND_ICON[k].replace(/width="1\d"/, 'width="14"').replace(/height="1\d"/, 'height="14"')}<span>${KIND_LABEL[k]}</span><span class="count num">${SOURCES.filter((s) => s.kind === k).length}</span></button>`,
              )
              .join(
                '',
              )}</div></div><div class="pop-row"><span class="pop-help">Pick one or more.</span><button class="btn btn-primary" data-apply-type>Apply</button></div>`;
          if (active === 'date')
            return `<div><p class="pop-label">Quick</p><div class="preset-grid">${[
              ['today', 'Today'],
              ['7d', 'Last 7 days'],
              ['30d', 'Last 30 days'],
              ['2m', 'Last 2 months'],
              ['lastmonth', 'Month before last'],
              ['year', 'This year'],
            ]
              .map(
                ([k, l]) =>
                  `<button class="pop-item" data-preset="${k}">${l}</button>`,

          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        history.replaceState(null, '', url);
        mount(i);
      }
      items.forEach((el, i) =>
        el.addEventListener('click', () => setActive(i)),
      );
      window.addEventListener('resize', () => {
        moveHighlight();
        if (pop) placePop(pop.el, pop.anchor);
      });
      document.addEventListener('keydown', (e) => {
        if (
          /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) ||
          e.target.isContentEditable
        )
          return;
        if (e.metaKey || e.ctrlKey || e.altKey || pop || overlay) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= variants.length) setActive(num - 1);
        else if (e.key === 'ArrowRight')
          setActive((currentIndex + 1) % variants.length);
        else if (e.key === 'ArrowLeft')
          setActive((currentIndex - 1 + variants.length) % variants.length);
      });
      setActive(
        (parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1,
      );
      requestAnimationFrame(() =>
        requestAnimationFrame(() => picker.setAttribute('data-ready', '')),
      );
    </script>
  </body>
</html>
