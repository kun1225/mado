<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mado dock and studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ---------- Mado tokens (packages/ui/src/styles.css) ---------- */
      :root {
        --bg: oklch(0.96 0 0);
        --fg: oklch(0.205 0 0);
        --muted: oklch(0.94 0 0);
        --muted-fg: oklch(0.556 0 0);
        --border: oklch(0.86 0 0);
        --accent: oklch(0.305 0 0);
        --accent-fg: oklch(0.985 0 0);
        --danger: oklch(0.52 0.09 30);
        --surface: oklch(0.995 0 0);
        --hover: oklch(0.205 0 0 / 0.05);
        --folder-red: oklch(0.82 0.1 25);
        --folder-orange: oklch(0.85 0.1 60);
        --folder-yellow: oklch(0.9 0.11 95);
        --folder-green: oklch(0.85 0.1 150);
        --folder-blue: oklch(0.83 0.08 245);
        --folder-purple: oklch(0.8 0.09 300);
        --folder-pink: oklch(0.84 0.09 350);
        --folder-gray: oklch(0.86 0 0);
        --radius-md: 0.5rem;
        --radius-lg: 0.75rem;
        --ease-standard: cubic-bezier(0.2, 0, 0, 1);
        --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
        --shadow-raised:
          0 0 0 1px rgb(0 0 0 / 0.05), 0 1px 3px rgb(0 0 0 / 0.06),
          0 10px 28px -10px rgb(0 0 0 / 0.16);
        --shadow-float:
          0 0 0 1px rgb(0 0 0 / 0.06), 0 2px 6px rgb(0 0 0 / 0.06),
          0 16px 40px -12px rgb(0 0 0 / 0.2);
        --img-outline: rgb(0 0 0 / 0.1);
        --edge: max(16px, min(3.5vw, 96px));
        --z-bar: 150;
        --z-overlay: 199;
        --z-modal: 200;
        --z-popover: 205;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.145 0 0);
          --fg: oklch(0.985 0 0);
          --muted: oklch(0.269 0 0);
          --muted-fg: oklch(0.7 0 0);
          --border: oklch(0.269 0 0);
          --accent: oklch(0.96 0 0);
          --accent-fg: oklch(0.145 0 0);
          --danger: oklch(0.7 0.08 30);
          --surface: oklch(0.195 0 0);
          --hover: oklch(1 0 0 / 0.06);
          --folder-red: oklch(0.5 0.12 25);
          --folder-orange: oklch(0.56 0.11 60);
          --folder-yellow: oklch(0.62 0.1 95);
          --folder-green: oklch(0.52 0.1 150);
          --folder-blue: oklch(0.5 0.1 245);
          --folder-purple: oklch(0.48 0.11 300);
          --folder-pink: oklch(0.54 0.1 350);
          --folder-gray: oklch(0.4 0 0);
          --shadow-raised: 0 0 0 1px rgb(255 255 255 / 0.09);
          --shadow-float:
            0 0 0 1px rgb(255 255 255 / 0.1), 0 16px 40px -12px rgb(0 0 0 / 0.6);
          --img-outline: rgb(255 255 255 / 0.1);
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: Geist, ui-sans-serif, system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
        touch-action: manipulation;
      }
      button {
        cursor: pointer;
      }
      input,
      select {
        font-size: 16px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      svg {
        flex-shrink: 0;
      }
      .num {
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--muted-fg);
      }

      /* ---------- buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--fg);
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        transition:
          background-color 150ms ease-out,
          color 150ms ease-out,
          scale 150ms ease-out;
      }
      .btn:active {
        scale: 0.96;
      }
      @media (hover: hover) and (pointer: fine) {
        .btn:hover {
          background: var(--hover);
        }
      }
      .btn-primary {
        background: var(--accent);
        color: var(--accent-fg);
      }
      @media (hover: hover) and (pointer: fine) {
        .btn-primary:hover {
          background: color-mix(in oklch, var(--accent) 88%, var(--bg));
        }
      }
      .btn-soft {
        background: var(--muted);
      }
      .btn-danger {
        background: var(--danger);
        color: #fff;
      }
      .btn-icon {
        width: 36px;
        padding: 0;
        justify-content: center;
      }
      .btn[aria-pressed='true'],
      .btn[aria-expanded='true'].btn-toggle {
        background: var(--accent);
        color: var(--accent-fg);
      }

      /* ---------- chips ---------- */
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        height: 28px;
        border-radius: 999px;
        background: var(--surface);
        box-shadow: var(--shadow-raised);
        font-size: 13px;
        font-weight: 500;
        max-width: 100%;
      }
      .chip > button,
      .chip > span {
        border: 0;
        background: transparent;
        height: 100%;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 999px;
      }
      .chip-main {
        padding: 0 4px 0 10px;
        min-width: 0;
      }
      .chip-main span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip-x {
        width: 26px;
        justify-content: center;
        color: var(--muted-fg);
        position: relative;
      }
      @media (hover: hover) and (pointer: fine) {
        .chip-x:hover {
          color: var(--fg);
        }
        button.chip-main:hover {
          color: var(--muted-fg);
        }
      }
      .chip svg {
        width: 14px;
        height: 14px;
        color: var(--muted-fg);
      }
      .chip-ghost {
        height: 28px;
        padding: 0 10px;
        gap: 6px;
        display: inline-flex;
        align-items: center;
        border: 1px dashed var(--border);
        border-radius: 999px;
        background: transparent;
        color: var(--muted-fg);
        font-size: 13px;
        font-weight: 500;
        transition:
          color 150ms ease-out,
          border-color 150ms ease-out;
      }
      @media (hover: hover) and (pointer: fine) {
        .chip-ghost:hover {
          color: var(--fg);
          border-color: var(--muted-fg);
        }
      }
      .kbd {
        font-size: 11px;
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--muted);
        color: var(--muted-fg);
        font-family: inherit;
      }

      /* ---------- source grid (mirrors source-grid + source-card) ---------- */
      .grid {
        columns: 240px;
        column-gap: 10px;
      }
      .grid-side {
        columns: 2;
        column-gap: 8px;
      }
      .card {
        break-inside: avoid;
        margin: 0 0 10px;
      }
      .grid-side .card {
        margin-bottom: 8px;
      }
      .card-hit {
        display: block;
        position: relative;
        padding: 0;
        border: 0;
        background: none;
        border-radius: var(--radius-md);
        width: 100%;
        transition: scale 150ms ease-out;
      }
      .card-hit:active {
        scale: 0.985;
      }
      .card-media {
        display: block;
        position: relative;
        overflow: hidden;
        border-radius: var(--radius-md);
        outline: 1px solid var(--img-outline);
        outline-offset: -1px;
        background: var(--muted);
      }
      .card-media img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .card-hit::after {
        content: attr(data-name);
        position: absolute;
        inset: auto 0 0 0;
        padding: 24px 10px 8px;
        font-size: 12.5px;
        color: #fff;
        text-align: left;
        background: linear-gradient(transparent, rgb(0 0 0 / 0.55));
        border-radius: 0 0 var(--radius-md) var(--radius-md);
        opacity: 0;
        transition: opacity 150ms ease-out;
        pointer-events: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      @media (hover: hover) and (pointer: fine) {
        .card-hit:hover::after {
          opacity: 1;
        }
      }
      .card-hit[data-current]::before {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 11px;
        box-shadow: 0 0 0 2px var(--fg);
        pointer-events: none;
        z-index: 1;
      }
      .badge {
        position: absolute;
        left: 8px;
        top: 8px;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 8px;
        border-radius: 999px;
        font-size: 11.5px;
        font-weight: 500;
        background: rgb(10 10 10 / 0.62);
        color: #fff;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        pointer-events: none;
        max-width: calc(100% - 16px);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .badge svg {
        width: 12px;
        height: 12px;
      }
      .board-mini {
        position: absolute;
        inset: 0;
        background-color: var(--muted);
        background-image: radial-gradient(var(--border) 1px, transparent 1px);
        background-size: 12px 12px;
      }
      .board-mini span {
        position: absolute;
        border-radius: 3px;
        background-size: cover;
        background-position: center;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
      }
      .board-mini .mini-note {
        background: var(--surface);
      }
      .empty {
        padding: 64px 16px;
        text-align: center;
        color: var(--muted-fg);
        display: grid;
        justify-items: center;
        gap: 12px;
      }
      .empty strong {
        color: var(--fg);
        font-size: 15px;
        font-weight: 500;
      }
      .empty p {
        margin: 0;
        max-width: 42ch;
        text-wrap: pretty;
      }

      /* ---------- library page ---------- */
      .lib {
        padding: 16px var(--edge) 140px;
        min-height: 100vh;
      }
      .lib-top {
        display: flex;
        align-items: center;
        gap: 16px;
        min-height: 44px;
        flex-wrap: wrap;
      }
      .ltabs {
        display: inline-flex;
        padding: 3px;
        border-radius: 999px;
        background: var(--muted);
      }
      .ltabs button {
        height: 30px;
        padding: 0 14px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-fg);
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .ltabs button[aria-selected='true'] {
        background: var(--surface);
        color: var(--fg);
        box-shadow: var(--shadow-raised);
      }
      .ltabs svg {
        width: 15px;
        height: 15px;
      }
      .crumbs {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-wrap: wrap;
        font-size: 13.5px;
        color: var(--muted-fg);
        min-width: 0;
      }
      .crumbs button {
        border: 0;
        background: transparent;
        height: 28px;
        padding: 0 6px;
        border-radius: 6px;
        color: inherit;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (hover: hover) and (pointer: fine) {
        .crumbs button:hover {
          background: var(--hover);
          color: var(--fg);
        }
      }
      .crumbs .sep {
        color: var(--border);
        padding: 0 1px;
      }
      .crumbs [aria-current='page'] {
        color: var(--fg);
        padding: 0 6px;
        max-width: 260px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .crumbs button.drop-ok {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .title-row {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 10px;
      }
      .title-row .back {
        width: 32px;
        height: 32px;
      }
      .title-input {
        border: 1px solid transparent;
        background: transparent;
        border-radius: var(--radius-md);
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.02em;
        height: 40px;
        padding: 0 10px;
        field-sizing: content;
        min-width: 60px;
        max-width: 100%;
      }
      @media (hover: hover) and (pointer: fine) {
        .title-input:hover {
          border-color: var(--border);
        }
      }
      .title-input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 0;
      }
      .folder-row {
        display: flex;
        gap: 16px;
        overflow-x: auto;
        padding: 24px 0 4px;
        margin-bottom: 20px;
        scrollbar-width: none;
      }
      .folder-row::-webkit-scrollbar {
        display: none;
      }

      /* folder card (mirrors collection-card + collection-card-pocket) */
      .fcard {
        --pf: var(--muted);
        --pb: var(--border);
        position: relative;
        flex: 0 0 176px;
        height: 176px;
        border: 1px solid var(--border);
        border-radius: var(--radius-md);
        background: transparent;
        padding: 0;
        text-align: left;
        transition:
          border-color 150ms ease-out,
          scale 150ms ease-out,
          background-color 150ms ease-out;
      }
      @media (hover: hover) and (pointer: fine) {
        .fcard:hover {
          border-color: var(--fg);
        }
      }
      .fcard.drop-ok {
        scale: 1.02;
        border-color: var(--accent);
        background: color-mix(in oklch, var(--accent) 10%, transparent);
      }
      .pocket {
        position: absolute;
        left: 50%;
        top: 22px;
        width: 112px;
        height: 92px;
        margin-left: -56px;
        filter: drop-shadow(0 4px 6px rgb(0 0 0 / 0.12));
        perspective: 400px;
        pointer-events: none;
      }
      .pocket .back {
        position: absolute;
        inset: auto 0 0 0;
        height: 72px;
        border-radius: 6px;
        border-top-left-radius: 0;
        background: var(--pb);
      }
      .pocket .tab {
        position: absolute;
        left: 0;
        bottom: 72px;
        width: 40px;
        height: 8px;
        border-radius: 6px 6px 0 0;
        background: var(--pb);
      }
      .pocket .prev {
        position: absolute;
        left: 50%;
        bottom: 30px;
        width: 48px;
        height: 56px;
        margin-left: -24px;
        border-radius: 4px;
        overflow: hidden;
        outline: 1px solid var(--img-outline);
        outline-offset: -1px;
        background: var(--muted) center / cover;
        transform-origin: bottom;
        translate: calc(var(--o) * 14px) 0;
        rotate: calc(var(--o) * 3deg);
        transition:
          translate 120ms var(--ease-out-quart),
          rotate 120ms var(--ease-out-quart);
      }
      .pocket .front {
        position: absolute;
        inset: auto 0 0 0;
        height: 64px;
        border-radius: 6px;
        background: var(--pf)
          linear-gradient(to bottom, rgb(255 255 255 / 0.25), rgb(0 0 0 / 0.05));
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.35);
        transform-origin: bottom;
        transition: transform 120ms var(--ease-out-quart);
      }
      @media (hover: hover) and (pointer: fine) {
        .fcard:hover .front {
          transform: rotateX(-28deg);
          transition-duration: 240ms;
        }
        .fcard:hover .prev {
          translate: calc(var(--o) * 30px) -22%;
          rotate: calc(var(--o) * 9deg);
          transition-duration: 240ms;
          transition-delay: var(--d);
        }
      }
      .fcard-label {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 12px;
        min-width: 0;
      }
      .fcard-label b {
        display: block;
        font-weight: 500;
        font-size: 14px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fcard-label span {
        color: var(--muted-fg);
        font-size: 14px;
      }
      .fcard-new {
        border-style: dashed;
        color: var(--muted-fg);
        display: grid;
        place-items: center;
      }
      @media (hover: hover) and (pointer: fine) {
        .fcard-new:hover {
          color: var(--fg);
        }
      }
      .fcard-new .fcard-label {
        color: inherit;
      }
      .active-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
        margin: 0 0 16px;
      }
      .active-row:empty {
        display: none;
      }

      /* ---------- dock ---------- */
      .dock {
        position: fixed;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        z-index: var(--z-bar);
        width: min(680px, calc(100vw - 32px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
      .studio .dock {
        position: absolute;
        width: min(680px, calc(100% - 32px));
      }
      .dock-row {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        width: 100%;
      }
      .glass {
        background: color-mix(in oklch, var(--surface) 84%, transparent);
        backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        box-shadow: var(--shadow-float);
      }
      .dock-add {
        width: 48px;
        height: 48px;
        border-radius: 999px;
        flex-shrink: 0;
      }
      .dock-bar {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 26px;
        min-height: 48px;
      }
      .dock-bar .btn-icon {
        width: 40px;
        height: 40px;
      }
      .dock-search {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 4px 0 8px;
      }
      .dock-search input {
        flex: 1;
        min-width: 80px;
        height: 40px;
        border: 0;
        background: transparent;
        outline: none;
      }
      .dock-search input::-webkit-search-cancel-button {
        display: none;
      }
      .dock-search input::placeholder {
        color: var(--muted-fg);
      }
      .dock-search .chips {
        flex-wrap: nowrap;
      }
      .sf-icon {
        display: inline-flex;
        color: var(--muted-fg);
        pointer-events: none;
      }
      .sheet {
        width: 100%;
        border-radius: 20px;
        padding: 14px;
        max-height: min(56vh, 540px);
        overflow: auto;
        transform-origin: bottom center;
        animation: sheet-in 200ms var(--ease-out);
        display: grid;
        gap: 14px;
        align-content: start;
      }
      .sheet.wide {
        width: min(880px, calc(100vw - 32px));
      }
      .studio .sheet.wide {
        width: min(880px, calc(100% + 0px));
      }
      @keyframes sheet-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
      }
      .sheet[hidden] {
        display: none;
      }
      .sheet h3 {
        margin: 0 0 8px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted-fg);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .suggest {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }

      /* folder manager */
      .fm {
        padding: 0;
        overflow: hidden;
        display: block;
      }
      .fm-cols {
        display: flex;
        overflow-x: auto;
        max-height: min(52vh, 380px);
      }
      .fm-col {
        flex: 0 0 228px;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--border);
        min-height: 0;
      }
      .fm-col:last-child {
        border-right: 0;
      }
      .fm-list {
        flex: 1;
        overflow: auto;
        padding: 6px;
      }
      .fm-foot {
        padding: 6px;
        border-top: 1px solid var(--border);
      }
      .fm-row {
        display: flex;
        align-items: center;
        border-radius: 6px;
        position: relative;
      }
      .fm-row[aria-current='true'] {
        background: var(--muted);
      }
      .fm-row.drop-ok {
        background: var(--accent);
        color: var(--accent-fg);
      }
      @media (hover: hover) and (pointer: fine) {
        .fm-row:hover {
          background: var(--hover);
        }
        .fm-row[aria-current='true']:hover {
          background: var(--muted);
        }
      }
      .fm-go {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        padding: 0 6px 0 10px;
        border: 0;
        background: transparent;
        border-radius: 6px;
        text-align: left;
        font-size: 13.5px;
      }
      .fm-go .name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .fm-go .count {
        color: var(--muted-fg);
        font-size: 12px;
      }
      .fm-go svg {
        width: 14px;
        height: 14px;
        color: var(--muted-fg);
      }
      .fm-row.drop-ok .fm-go svg,
      .fm-row.drop-ok .count {
        color: inherit;
      }
      .fm-act {
        width: 28px;
        height: 28px;
        border: 0;
        background: transparent;
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: var(--muted-fg);
        flex-shrink: 0;
      }
      .fm-act svg {
        width: 14px;
        height: 14px;
      }
      @media (hover: hover) and (pointer: fine) {
        .fm-act {
          opacity: 0;
          transition: opacity 150ms ease-out;
        }
        .fm-row:hover .fm-act,
        .fm-row:focus-within .fm-act {
          opacity: 1;
        }
        .fm-act:hover {
          background: var(--hover);
          color: var(--fg);
        }
      }
      .fm-edit {
        display: flex;
        gap: 4px;
        padding: 3px;
        width: 100%;
        min-width: 0;
      }
      .fm-edit input {
        flex: 1;
        min-width: 0;
        height: 30px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0 8px;
        background: var(--bg);
        font-size: 16px;
      }
      .fm-confirm {
        padding: 8px 10px;
        display: grid;
        gap: 8px;
        font-size: 13px;
        width: 100%;
        background: var(--muted);
        border-radius: 6px;
      }
      .fm-confirm p {
        margin: 0;
      }
      .fm-confirm div {
        display: flex;
        gap: 6px;
      }
      .fm-hint {
        margin: 0;
        padding: 8px 14px;
        font-size: 12px;
        color: var(--muted-fg);
        border-top: 1px solid var(--border);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        flex-shrink: 0;
      }

      /* add menu + popover */
      .menu-item {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        height: 40px;
        padding: 0 10px;
        border: 0;
        border-radius: 8px;
        background: transparent;
        text-align: left;
        font-size: 14px;
      }
      .menu-item svg {
        color: var(--muted-fg);
      }
      .menu-item small {
        margin-left: auto;
        color: var(--muted-fg);
        font-size: 12px;
      }
      @media (hover: hover) and (pointer: fine) {
        .menu-item:hover {
          background: var(--hover);
        }
      }
      .pop {
        position: fixed;
        z-index: var(--z-popover);
        width: min(420px, calc(100vw - 32px));
        background: var(--surface);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow-float);
        padding: 6px;
        animation: pop-in 160ms var(--ease-out);
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }
      .pop-tabs {
        display: flex;
        gap: 2px;
        padding: 2px;
        background: var(--muted);
        border-radius: 6px;
      }
      .pop-tabs button {
        flex: 1;
        height: 30px;
        border: 0;
        background: transparent;
        border-radius: 5px;
        font-size: 13px;
        font-weight: 500;
        color: var(--muted-fg);
      }
      .pop-tabs button[aria-selected='true'] {
        background: var(--surface);
        color: var(--fg);
        box-shadow: var(--shadow-raised);
      }
      .pop-body {
        padding: 10px 6px 6px;
        display: grid;
        gap: 14px;
        max-height: min(420px, 60vh);
        overflow: auto;
      }
      .pop-label {
        margin: 0 0 6px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted-fg);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .preset-grid,
      .type-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }
      .pop-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        height: 34px;
        padding: 0 10px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        text-align: left;
        font-size: 13.5px;
      }
      @media (hover: hover) and (pointer: fine) {
        .pop-item:hover {
          background: var(--hover);
        }
      }
      .pop-item[aria-pressed='true'],
      .pop-item[aria-current='true'] {
        background: var(--accent);
        color: var(--accent-fg);
      }
      .pop-item[aria-current='true'] .place {
        color: inherit;
        opacity: 0.75;
      }
      .pop-item .count {
        margin-left: auto;
        color: var(--muted-fg);
        font-size: 12px;
      }
      .pop-item span:not(.count):not(.dot) {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pop-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        font-size: 13.5px;
      }
      .pop-row input,
      .pop-row select {
        height: 34px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--bg);
        padding: 0 8px;
      }
      .pop-row input[type='number'] {
        width: 64px;
      }
      .pop-row input[type='date'] {
        width: 148px;
      }
      .pop-row .btn {
        margin-left: auto;
      }
      .pop-help {
        margin: 0;
        font-size: 12.5px;
        color: var(--muted-fg);
      }
      .pop-section {
        margin: 4px 0 2px;
        padding: 0 10px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted-fg);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      /* ---------- chat (shared) ---------- */
      .chat-log {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .msg-user {
        align-self: flex-end;
        max-width: 85%;
        background: var(--muted);
        padding: 8px 12px;
        border-radius: 16px 16px 4px 16px;
      }
      .msg-ai {
        display: grid;
        gap: 10px;
        max-width: 62ch;
      }
      .msg-ai p {
        margin: 0;
        text-wrap: pretty;
      }
      .who {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted-fg);
        font-weight: 500;
      }
      .who svg {
        width: 14px;
        height: 14px;
      }
      .caret {
        display: inline-block;
        width: 7px;
        height: 14px;
        margin-left: 2px;
        vertical-align: -2px;
        background: var(--fg);
        animation: blink 900ms steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .cites {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }
      .cite {
        width: 48px;
        height: 48px;
        padding: 0;
        border: 0;
        border-radius: 6px;
        overflow: hidden;
        outline: 1px solid var(--img-outline);
        outline-offset: -1px;
        background: var(--muted);
      }
      .cite img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .msg-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chat-empty {
        color: var(--muted-fg);
        display: grid;
        gap: 10px;
        padding: 4px 0;
      }
      .chat-empty p {
        margin: 0;
        max-width: 60ch;
      }
      .chat-sheet {
        background: color-mix(in oklch, var(--surface) 97%, transparent);
        padding: 0;
        gap: 0;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        height: min(56vh, 540px);
      }
      .chat-head {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px;
        border-bottom: 1px solid var(--border);
        min-height: 52px;
      }
      .chat-body {
        flex: 1;
        overflow: auto;
        padding: 16px;
        min-height: 0;
      }
      .place {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--muted-fg);
        min-width: 0;
      }
      .place svg {
        width: 12px;
        height: 12px;
      }
      .place span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* A · Tabs */
      .s-tabs {
        display: flex;
        gap: 2px;
        overflow-x: auto;
        flex: 1;
        min-width: 0;
        scrollbar-width: none;
      }
      .s-tab {
        border: 0;
        background: transparent;
        height: 34px;
        padding: 0 12px;
        border-radius: 8px;
        color: var(--muted-fg);
        white-space: nowrap;
        max-width: 200px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        font-weight: 500;
        flex-shrink: 0;
      }
      .s-tab span:first-child {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .s-tab[aria-selected='true'] {
        background: var(--muted);
        color: var(--fg);
      }
      @media (hover: hover) and (pointer: fine) {
        .s-tab:hover {
          color: var(--fg);
        }
      }
      .s-tab .x {
        width: 18px;
        height: 18px;
        border-radius: 4px;
        display: grid;
        place-items: center;
        margin-right: -6px;
        flex-shrink: 0;
      }
      .s-tab .x svg {
        width: 12px;
        height: 12px;
      }
      @media (hover: hover) and (pointer: fine) {
        .s-tab .x:hover {
          background: var(--hover);
        }
      }

      /* B · History */
      .hist {
        display: grid;
        grid-template-columns: 240px 1fr;
        flex: 1;
        min-height: 0;
      }
      .hist-list {
        border-right: 1px solid var(--border);
        overflow: auto;
        padding: 8px;
        display: grid;
        gap: 2px;
        align-content: start;
      }
      .hist-list input {
        height: 34px;
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        padding: 0 10px;
        font-size: 16px;
        margin-bottom: 6px;
      }
      .hist-item {
        border: 0;
        background: transparent;
        text-align: left;
        padding: 7px 10px;
        border-radius: 8px;
        display: grid;
        gap: 1px;
        width: 100%;
        min-width: 0;
      }
      .hist-item b {
        font-weight: 500;
        font-size: 13.5px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hist-item[aria-current='true'] {
        background: var(--muted);
      }
      @media (hover: hover) and (pointer: fine) {
        .hist-item:hover {
          background: var(--hover);
        }
        .hist-item[aria-current='true']:hover {
          background: var(--muted);
        }
      }
      .hist-group {
        margin: 8px 10px 2px;
        font-size: 11.5px;
        font-weight: 500;
        color: var(--muted-fg);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }
      .hist-main {
        display: flex;
        flex-direction: column;
        min-height: 0;
        min-width: 0;
      }
      .hist-title {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        min-height: 48px;
        min-width: 0;
      }
      .hist-title b {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (max-width: 720px) {
        .hist {
          grid-template-columns: 1fr;
        }
        .hist-list {
          display: none;
        }
      }

      /* C · Per place */
      .place-btn {
        border: 0;
        background: transparent;
        height: 36px;
        padding: 0 10px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: 60%;
        text-align: left;
      }
      .place-btn b {
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (hover: hover) and (pointer: fine) {
        .place-btn:hover {
          background: var(--hover);
        }
      }
      .elsewhere {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        margin: -16px -16px 14px;
        background: var(--muted);
        font-size: 13px;
      }
      .elsewhere span {
        flex: 1;
        min-width: 0;
      }

      /* ---------- studio ---------- */
      .studio {
        display: grid;
        grid-template-columns: 340px 1fr;
        height: 100dvh;
      }
      .studio.collapsed {
        grid-template-columns: 0 1fr;
      }
      .st-side {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        min-width: 0;
      }
      .studio.collapsed .st-side {
        visibility: hidden;
        border-right: 0;
      }
      .st-side-head {
        display: grid;
        gap: 6px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
      }
      .st-side-head .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 32px;
        padding: 0 10px 0 6px;
        border: 0;
        background: transparent;
        border-radius: 8px;
        font-weight: 500;
        font-size: 13.5px;
        min-width: 0;
        max-width: 240px;
        flex-shrink: 1;
      }
      .back-link span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      @media (hover: hover) and (pointer: fine) {
        .back-link:hover {
          background: var(--hover);
        }
      }
      .st-side .crumbs {
        font-size: 12.5px;
      }
      .st-side .crumbs button {
        height: 24px;
        max-width: 140px;
      }
      .st-side-grid {
        flex: 1;
        overflow: auto;
        padding: 10px 12px 40px;
      }
      .st-side-grid .card {
        cursor: grab;
      }
      .st-side .active-row {
        margin: 0;
      }
      .st-main {
        position: relative;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .st-top {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 52px;
        padding: 0 12px;
        border-bottom: 1px solid var(--border);
        min-width: 0;
      }
      .st-top h1 {
        margin: 0 0 0 2px;
        font-size: 15px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .st-top .meta {
        color: var(--muted-fg);
        font-size: 13px;
        white-space: nowrap;
      }
      .st-board {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      @media (max-width: 760px) {
        .studio,
        .studio.collapsed {
          grid-template-columns: 1fr;
        }
        .st-side {
          position: fixed;
          inset: 0 auto 0 0;
          width: min(340px, 90vw);
          z-index: var(--z-bar);
          background: var(--bg);
        }
      }

      /* board */
      .board {
        position: relative;
        overflow: hidden;
        height: 100%;
        flex: 1;
        background-color: var(--bg);
        background-image: radial-gradient(
          var(--border) 1.2px,
          transparent 1.2px
        );
        background-size: 20px 20px;
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      .board.panning {
        cursor: grabbing;
      }
      .board.drop-ok {
        box-shadow: inset 0 0 0 2px var(--accent);
      }
      .board-world {
        position: absolute;
        left: 0;
        top: 0;
      }
      .b-item {
        position: absolute;
        border-radius: 6px;
        overflow: hidden;
        box-shadow: var(--shadow-raised);
        background: var(--muted);
        cursor: move;
      }
      .b-item img {
        display: block;
        width: 100%;
        pointer-events: none;
      }
      .b-item.dragging {
        box-shadow: var(--shadow-float);
      }
      .b-note {
        position: absolute;
        width: 220px;
        padding: 12px 14px;
        border-radius: 8px;
        background: var(--surface);
        box-shadow: var(--shadow-raised);
        font-size: 14px;
        cursor: move;
      }
      .board-empty {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        color: var(--muted-fg);
        pointer-events: none;
      }
      .board-empty strong {
        display: block;
        color: var(--fg);
        font-weight: 500;
        margin-bottom: 4px;
      }

      /* overlays */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: var(--z-overlay);
        background: rgb(0 0 0 / 0.4);
        animation: fade-in 200ms var(--ease-out);
      }
      @keyframes fade-in {
        from {
          opacity: 0;
        }
      }
      .modal {
        position: fixed;
        z-index: var(--z-modal);
        inset: 24px;
        margin: auto;
        max-width: 980px;
        max-height: 760px;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow-float);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        animation: modal-in 220ms var(--ease-out);
      }
      @keyframes modal-in {
        from {
          opacity: 0;
          transform: scale(0.97);
        }
      }
      .modal-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 10px 10px 18px;
        border-bottom: 1px solid var(--border);
      }
      .modal-head h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 500;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .lightbox {
        display: grid;
        grid-template-columns: 1fr 280px;
        flex: 1;
        min-height: 0;
      }
      .lightbox-media {
        background: var(--muted);
        display: grid;
        place-items: center;
        padding: 24px;
        min-height: 0;
      }
      .lightbox-media img {
        max-width: 100%;
        max-height: 100%;
        border-radius: var(--radius-md);
        outline: 1px solid var(--img-outline);
        outline-offset: -1px;
      }
      .lightbox-info {
        padding: 18px;
        display: grid;
        align-content: start;
        gap: 14px;
        border-left: 1px solid var(--border);
      }
      .lightbox-info dl {
        margin: 0;
        display: grid;
        gap: 10px;
      }
      .lightbox-info dt {
        font-size: 12px;
        color: var(--muted-fg);
      }
      .lightbox-info dd {
        margin: 2px 0 0;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 96px;
        transform: translateX(-50%);
        z-index: var(--z-popover);
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--fg);
        color: var(--bg);
        font-size: 13.5px;
        animation: sheet-in 200ms var(--ease-out);
        max-width: calc(100vw - 32px);
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
        }
      }

      /* Harness only: room for the picker at the top, so it never covers the work. */
      body[data-picker-top] #stage {
        padding-top: 64px;
      }
      body[data-picker-top] .studio {
        height: calc(100dvh - 64px);
      }

      /* ---------- picker (verbatim from PICKER.md) ---------- */
      .proto-picker {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2147483647;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 4px;
        border-radius: 999px;
        background: rgba(10, 10, 10, 0.82);
        -webkit-backdrop-filter: blur(12px) saturate(1.4);
        backdrop-filter: blur(12px) saturate(1.4);
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.08) inset,
          0 8px 24px rgba(0, 0, 0, 0.24),
          0 2px 6px rgba(0, 0, 0, 0.12);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: 13px;
        line-height: 1;
        -webkit-font-smoothing: antialiased;
        user-select: none;
        -webkit-user-select: none;
      }
      .proto-picker-highlight {
        position: absolute;
        top: 4px;
        left: 0;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
        will-change: transform;
      }
      .proto-picker[data-ready] .proto-picker-highlight {
        transition:
          transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
          width 250ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .proto-picker[data-ready] .proto-picker-highlight {
          transition: none;
        }
      }
      .proto-picker-item {
        position: relative;
        display: flex;
        align-items: center;
        height: 28px;
        padding: 0 12px;
        border: 0;

        return 'canvas';
      };
      function parseQuery(text) {
        let rest = ` ${text} `;
        const out = [];
        const take = (re, fn) => {
          rest = rest.replace(re, (...m) => {
            const f = fn(m);
            if (!f) return m[0];
            out.push(f);
            return ' ';
          });
        };
        const U = '(day|week|month|year)s?';
        take(
          new RegExp(
            `\\b(?:from )?(\\w+) ${U} ago (?:to|until|-|–) (?:(\\w+) ${U} ago|last (week|month)|now|today)\\b`,
            'gi',
          ),
          (m) => {
            const a = toNum(m[1]);
            if (!a) return null;
            let b = 0,
              bu = m[2].toLowerCase();
            if (m[3]) {
              b = toNum(m[3]);
              bu = m[4].toLowerCase();
            } else if (m[5]) {
              b = 1;
              bu = m[5].toLowerCase();
            }
            return dateRange(a, m[2].toLowerCase(), b, bu);
          },
        );
        take(
          new RegExp(
            `\\b(?:in the |from the )?(?:last|past) (\\w+) ${U}\\b`,
            'gi',
          ),
          (m) => {
            const n = toNum(m[1]);
            return n ? dateLast(n, m[2].toLowerCase()) : null;
          },
        );
        take(
          /\b(?:from |in )?(?:the )?(?:last|past) (day|week|month|year)\b/gi,
          (m) => dateLast(1, m[1].toLowerCase()),
        );
        take(/\btoday\b/gi, () => datePreset('today'));
        take(/\bthis year\b/gi, () => datePreset('year'));
        const kinds = new Set();
        rest = rest.replace(
          /\b(images?|photos?|pictures?|videos?|clips?|websites?|sites?|links?|canvas(?:es)?|boards?|moodboards?)\b/gi,
          (m) => {
            kinds.add(kindOf(m));
            return ' ';
          },
        );
        if (kinds.size) out.push({ kind: 'type', kinds: [...kinds] });
        [...COLLECTIONS]
          .sort((a, b) => b.name.length - a.name.length)
          .forEach((c) => {
            const short = c.name
              .split(' — ')[0]
              .toLowerCase()
              .replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(
              `\\b(?:in|from) (?:my )?(?:the )?${short}\\b`,
              'i',
            );
            if (re.test(rest)) {
              rest = rest.replace(re, ' ');
              out.push({ kind: 'col', cid: c.id });
            }
          });
        return {
          filters: out.map((f) => ({ ...f, id: nid() })),
          rest: rest.replace(/\s+/g, ' ').trim(),
        };
      }
      const STOP = new Set([
        'the',
        'my',
        'all',
        'show',
        'me',
        'from',
        'in',
        'of',
        'and',
        'with',
        'find',
        'any',
        'some',
        'what',
        'which',
        'do',
        'does',
        'have',
        'i',
        'saved',
        'that',
        'are',
        'is',
        'a',
        'an',
        'to',
        'make',
        'create',
        'build',
        'start',
        'for',
        'these',
        'those',
        'about',
        'common',
        'between',
        'ago',
        'can',
        'you',
        'out',
        'pull',
        'give',
        'this',
        'it',
        'too',
        'how',
        'why',
      ]);
      const keywords = (t) =>
        t
          .toLowerCase()
          .replace(/[?!.,]/g, ' ')
          .split(/\s+/)
          .filter((w) => w && !STOP.has(w));
      const hay = (s) =>
        `${s.name} ${s.url || ''} ${s.kind} ${s.collectionIds
          .map((c) =>
            ancestors(c)
              .map((a) => a.name)
              .join(' '),
          )
          .join(' ')}`.toLowerCase();
      function matches(s, f) {
        if (f.kind === 'type') return f.kinds.includes(s.kind);
        if (f.kind === 'date')
          return (!f.from || s.date >= f.from) && (!f.to || s.date <= f.to);
        if (f.kind === 'col') return inBranch(s, f.cid);
        return true;
      }
      function filterSources({ filters = [], text = '', scope = null } = {}) {
        const words = keywords(text);
        return SOURCES.filter(
          (s) =>
            (!scope || inBranch(s, scope)) &&
            filters.every((f) => matches(s, f)) &&
            words.every((w) => hay(s).includes(w)),
        ).sort((a, b) => b.date - a.date);
      }
      const live = () => parseQuery(S.text);
      const currentResults = () => {
        const p = live();
        return filterSources({
          filters: [...S.filters, ...p.filters],
          text: p.rest,
          scope: S.scope,
        });
      };
      function filterLabel(f) {
        if (f.kind === 'type')
          return f.kinds.map((k) => KIND_LABEL[k]).join(', ');
        if (f.kind === 'date') return f.label;
        if (f.kind === 'col') return colById(f.cid)?.name || 'Deleted';
      }
      const filterIcon = (f) =>
        f.kind === 'date'
          ? ico.cal
          : f.kind === 'col'
            ? ico.folderSm
            : ico.type;

      /* =====================================================================
   Shared renderers — cards, chips, breadcrumbs
   ===================================================================== */
      const cardCache = new Map();
      function cardHTML(s) {
        const ar = s.kind === 'canvas' ? '4 / 3' : `${s.w} / ${s.h}`;
        let media,
          badge = '';
        if (s.kind === 'canvas') {
          media = boardMiniHTML(s);
          badge = `<span class="badge">${ico.board.replace(/14/g, '12')} Canvas · ${plural(s.items.length + s.notes.length, 'item')}</span>`;
        } else {
          media = `<img src="${imgUrl(s)}" alt="" loading="lazy" draggable="false">`;
          if (s.kind === 'video')
            badge = `<span class="badge">${ico.play} ${s.dur}</span>`;
          if (s.kind === 'website')
            badge = `<span class="badge">${ico.globe} ${esc(new URL(s.url).hostname)}</span>`;
        }
        return `<figure class="card" data-card="${s.id}" draggable="true" style="margin-inline:0"><button class="card-hit" data-open="${s.id}" data-name="${esc(s.name)}" aria-label="${s.kind === 'canvas' ? 'Open canvas' : 'Open'} ${esc(s.name)}"><span class="card-media" style="aspect-ratio:${ar}">${media}${badge}</span></button></figure>`;
      }
      function boardMiniHTML(c) {
        const boxes = [
          ...c.items.map((it) => {
            const s = byId(it.sid);
            return { x: it.x, y: it.y, w: it.w, h: (it.w * s.h) / s.w, s };
          }),
          ...c.notes.map((n) => ({
            x: n.x,
            y: n.y,
            w: 220,
            h: 70,
            note: true,
          })),
        ];
        if (!boxes.length) return '<span class="board-mini"></span>';
        const minX = Math.min(...boxes.map((b) => b.x)),
          minY = Math.min(...boxes.map((b) => b.y));
        const W = Math.max(...boxes.map((b) => b.x + b.w)) - minX,
          H = Math.max(...boxes.map((b) => b.y + b.h)) - minY;
        const k = Math.min(84 / W, 80 / (H * (4 / 3)));
        const ox = (100 - W * k) / 2,
          oy = (100 - H * k * (4 / 3)) / 2;
        return `<span class="board-mini">${boxes.map((b) => `<span class="${b.note ? 'mini-note' : ''}" style="left:${ox + (b.x - minX) * k}%;top:${oy + (b.y - minY) * k * (4 / 3)}%;width:${b.w * k}%;height:${b.h * k * (4 / 3)}%;${b.s ? `background-image:url(${imgUrl(b.s, 160)})` : ''}"></span>`).join('')}</span>`;
      }
      function cardEl(s) {
        let el = cardCache.get(s.id);
        if (!el) {
          const t = document.createElement('template');
          t.innerHTML = cardHTML(s).trim();
          el = t.content.firstElementChild;
          cardCache.set(s.id, el);
        }
        el.querySelector('.card-hit').toggleAttribute(
          'data-current',
          S.page === 'studio' && s.id === S.canvasId,
        );
        return el;
      }
      function renderGrid(container, list) {
        if (!container) return;
        if (!list.length) {
          const p = live();
          container.innerHTML =
            S.tab === 'deleted' && S.page === 'library'
              ? '<div class="empty" style="column-span:all"><strong>The trash is empty</strong><p>Deleted sources stay here for 30 days.</p></div>'
              : S.text || S.filters.length
                ? `<div class="empty" style="column-span:all"><strong>Nothing matches ${p.rest ? `“${esc(p.rest)}”` : 'these filters'}</strong><p>Try a wider date range, remove a filter, or search all collections.</p><button class="btn btn-soft" data-clear>Clear search</button></div>`
                : `<div class="empty" style="column-span:all"><strong>This ${S.scope && colById(S.scope)?.parentId ? 'folder' : 'collection'} is empty</strong><p>Drag sources onto it, or press + in the dock to upload.</p></div>`;
          return;
        }
        container.replaceChildren(...list.map(cardEl));
      }
      function chipHTML(f) {
        const label = esc(filterLabel(f));
        return `<span class="chip"><button type="button" class="chip-main" data-edit-filter="${f.id}" aria-label="Edit filter ${label}">${filterIcon(f)}<span>${label}</span></button><button type="button" class="chip-x" data-remove-filter="${f.id}" aria-label="Remove filter ${label}">${ico.x}</button></span>`;
      }
      function detectedHTML() {
        const p = live();
        if (!p.filters.length) return '';
        return `<button class="chip-ghost" data-commit type="button">${p.filters.map((f) => `${filterIcon(f)} ${esc(filterLabel(f))}`).join(' · ')} <kbd class="kbd">Enter</kbd> to keep</button>`;
      }
      function crumbsHTML(scope, { here = true } = {}) {
        const segs = scope ? ancestors(scope) : [];
        if (!segs.length && here)
          return '<span aria-current="page">Library</span>';
        return `<button type="button" data-scope="" data-drop-col="">Library</button>${segs.map((a, i) => `<span class="sep" aria-hidden="true">/</span>${i === segs.length - 1 && here ? `<span aria-current="page" title="${esc(a.name)}">${esc(a.name)}</span>` : `<button type="button" data-scope="${a.id}" data-drop-col="${a.id}" title="${esc(a.name)}">${esc(a.name)}</button>`}`).join('')}`;
      }

      /* =====================================================================
   App shell — library page and studio page share one dock
   ===================================================================== */
      function dockHTML() {
        return `<div class="dock" data-dock>
    <div class="sheet glass" data-sheet hidden></div>
    <div class="dock-row">
      <button class="btn btn-icon btn-toggle dock-add glass" data-dock-btn="add" aria-label="Add" aria-expanded="false">${ico.plus}</button>
      <div class="dock-bar glass">
        <button class="btn btn-icon btn-toggle" data-dock-btn="folders" aria-label="Collections and folders" aria-expanded="false">${ico.folder}</button>
        <form class="dock-search" role="search" data-dock-form>
          <span class="sf-icon" data-dock-icon>${ico.search}</span>
          <span class="chips" data-dock-chips></span>
          <label class="sr-only" for="dq">Search or ask</label>
          <input id="dq" data-search-input type="search" autocomplete="off" spellcheck="false">
        </form>
        <button class="btn btn-icon btn-toggle" data-dock-btn="chat" aria-label="Ask Mado" aria-expanded="false">${ico.spark}</button>
      </div>
    </div>
  </div>`;
      }

      function libraryHTML() {
        return `<div class="lib">
    <div class="lib-top">
      <div class="ltabs" role="tablist" aria-label="Library">
        <button role="tab" data-tab="all" aria-selected="${S.tab === 'all'}">${ico.image} All</button>
        <button role="tab" data-tab="deleted" aria-selected="${S.tab === 'deleted'}">${ico.trashTab} Deleted</button>
      </div>
      <nav class="crumbs" aria-label="Breadcrumb" data-crumbs></nav>
    </div>
    <div data-title-row></div>
    <div class="folder-row" data-folder-row aria-label="Folders"></div>
    <div class="active-row" data-active></div>
    <main class="grid" data-grid></main>
  </div>${dockHTML()}`;
      }

      function studioHTML() {
        const originLabel = S.origin
          ? colById(S.origin)?.name || 'Library'
          : 'Library';
        const back = `<button class="back-link" data-back aria-label="Back to ${esc(originLabel)}" title="Back to ${esc(originLabel)}">${ico.back}<span>${esc(originLabel)}</span></button>`;
        return `<div class="studio ${S.sidebar ? '' : 'collapsed'}" data-studio>
    <aside class="st-side" aria-label="Library" ${S.sidebar ? '' : 'inert'}>
      <div class="st-side-head">
        <div class="top">${back}<button class="btn btn-icon" data-collapse aria-label="Hide library" aria-expanded="true" title="Hide library  [">${ico.panel}</button></div>
        <nav class="crumbs" aria-label="Library folder" data-crumbs></nav>
        <div class="active-row" data-active></div>
      </div>
      <div class="st-side-grid"><main class="grid grid-side" data-grid></main></div>
    </aside>
    <section class="st-main" aria-label="Canvas">
      <div class="st-top">
        ${S.sidebar ? '' : `${back}<button class="btn btn-icon" data-collapse aria-label="Show library" aria-expanded="false" title="Show library  [">${ico.panel}</button><span class="muted" aria-hidden="true">/</span>`}
        <span class="sf-icon">${ico.board}</span><h1 data-canvas-title></h1><span class="meta num" data-canvas-meta></span>
      </div>
      <div class="st-board" data-board></div>
      ${dockHTML()}
    </section>
  </div>`;
      }

      let board = null;
      function mountApp() {
        closePop();
        closeOverlay();
        stage.innerHTML = S.page === 'studio' ? studioHTML() : libraryHTML();
        bindDock();
        if (S.page === 'studio')
          board = mountBoard($('[data-board]'), byId(S.canvasId));
        window.scrollTo(0, 0);
        update();
      }

      function update() {
        const studio = S.page === 'studio';
        $('[data-crumbs]').innerHTML =
          studio && !S.scope
            ? '<span aria-current="page">All sources</span>'
            : crumbsHTML(S.scope, { here: !studio });
        if (!studio) updateLibrary();
        else {
          const c = byId(S.canvasId);
          $('[data-canvas-title]').textContent = c.name;
          $('[data-canvas-meta]').textContent =
            `· ${plural(c.items.length + c.notes.length, 'item')}`;
        }
        $('[data-active]').innerHTML = S.filters.length
          ? `${S.filters.map(chipHTML).join('')}<button class="btn" data-clear>Clear</button>`
          : '';
        renderGrid(
          $('[data-grid]'),
          S.tab === 'deleted' && !studio ? [] : currentResults(),
        );
        updateDock();
      }

      function updateLibrary() {
        $$('[data-tab]').forEach((t) =>
          t.setAttribute('aria-selected', t.dataset.tab === S.tab),
        );
        const deleted = S.tab === 'deleted';
        const c = S.scope && colById(S.scope);
        $('[data-title-row]').innerHTML =
          c && !deleted
            ? `<div class="title-row"><button class="btn btn-icon back" data-scope="${c.parentId || ''}" aria-label="Back to ${esc(c.parentId ? colById(c.parentId).name : 'Library')}">${ico.back}</button><label class="sr-only" for="title-in">Collection name</label><input id="title-in" class="title-input" value="${esc(c.name)}" maxlength="100" data-title spellcheck="false" autocomplete="off"></div>`
            : '';
        const kids = children(S.scope);
        const row = $('[data-folder-row]');
        row.hidden = deleted;
        row.innerHTML = deleted
          ? ''
          : `<button class="fcard fcard-new" data-new-folder="${S.scope || ''}"><span aria-hidden="true">${ico.plus}</span><span class="fcard-label"><b>${S.scope ? 'New folder' : 'New collection'}</b></span></button>${kids.map(folderCardHTML).join('')}`;
        const t = $('[data-title]');
        if (t) {
          t.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') t.blur();
            if (e.key === 'Escape') {
              t.value = c.name;
              t.blur();
            }
          });
          t.addEventListener('blur', () => {
            const v = t.value.trim();
            if (v && v !== c.name) renameCollection(c.id, v);
            else t.value = c.name;
          });
        }
      }
      function folderCardHTML(c) {
        const prev = filterSources({ scope: c.id })
          .filter((s) => s.kind !== 'canvas')
          .slice(0, 3);
        const offs =
          { 1: [0], 2: [-0.5, 0.5], 3: [-1, 0, 1] }[prev.length] || [];
        const style = c.color
          ? `--pf:var(--folder-${c.color});--pb:color-mix(in oklch, var(--folder-${c.color}), black 15%)`
          : '';
        return `<button class="fcard" data-scope="${c.id}" data-drop-col="${c.id}" style="${style}" title="${esc(c.name)}">
    <span class="pocket" aria-hidden="true"><span class="back"></span><span class="tab"></span>${prev.map((s, i) => `<span class="prev" style="--o:${offs[i]};--d:${i * 40}ms;background-image:url(${imgUrl(s, 120)})"></span>`).join('')}<span class="front"></span></span>
    <span class="fcard-label"><b>${esc(c.name)}</b><span class="num">${plural(countIn(c.id), 'save')}</span></span>
  </button>`;
      }

      /* ---------- dock ---------- */
      function bindDock() {
        const input = $('#dq');
        input.value = S.text;
        input.addEventListener('input', () => {
          if (S.sheet === 'chat') return;
          S.text = input.value;
          S.sheet = 'search';
          // Results show in the sidebar, so searching with it hidden would look like nothing happened.
          if (S.page === 'studio' && !S.sidebar) {
            S.sidebar = true;
            mountApp();
            const i = $('#dq');
            i.focus();
            i.setSelectionRange(i.value.length, i.value.length);
            return;
          }
          update();
        });
        input.addEventListener('focus', () => {
          if (!S.sheet) {
            S.sheet = 'search';
            updateDock();
          }
        });
        input.addEventListener('keydown', (e) => {
          if (
            e.key === 'Backspace' &&
            !input.value &&
            S.filters.length &&
            S.sheet !== 'chat'
          ) {
            S.filters = S.filters.slice(0, -1);
            update();
          }
        });
        $('[data-dock-form]').addEventListener('submit', (e) => {
          e.preventDefault();
          if (S.sheet === 'chat') {
            ask(input.value);
            input.value = '';
            return;
          }
          commitText();
        });
        const dock = $('[data-dock]');
        dock.addEventListener('focusout', (e) => {
          if (!dock.contains(e.relatedTarget) && !pop && S.sheet === 'search') {
            S.sheet = null;
            updateDock();
          }
        });
      }
      function updateDock() {
        const chat = S.sheet === 'chat';
        $$('[data-dock-btn]').forEach((b) =>
          b.setAttribute('aria-expanded', S.sheet === b.dataset.dockBtn),
        );
        $('[data-dock-icon]').innerHTML = chat ? ico.spark : ico.search;
        const input = $('#dq');
        if (chat && input.value === S.text) input.value = '';
        if (!chat && input.value !== S.text) input.value = S.text;
        const where = S.scope ? colById(S.scope).name : null;
        input.placeholder = chat
          ? chatPlaceholder()
          : where
            ? `Search in ${where}…`
            : S.page === 'studio'
              ? 'Search your library…'
              : 'Search everything…';
        $('[data-dock-chips]').innerHTML =
          !chat && S.filters.length
            ? `<span class="chip" title="${S.filters.map(filterLabel).join(' · ')}"><span class="chip-main" style="padding-right:10px">${ico.type}<span class="num">${plural(S.filters.length, 'filter')}</span></span></span>`
            : '';
        const sheet = $('[data-sheet]');
        sheet.hidden = !S.sheet;
        sheet.className = `sheet glass${S.sheet === 'folders' ? ' fm' : ''}${chat ? ` chat-sheet${variant.wide ? ' wide' : ''}` : ''}`;
        if (S.sheet === 'search') sheet.innerHTML = searchSheetHTML();
        if (S.sheet === 'folders') sheet.innerHTML = folderManagerHTML();
        if (S.sheet === 'add') sheet.innerHTML = addMenuHTML();
        if (chat) {
          sheet.innerHTML = variant.chatHTML();
          afterChatRender();
        }
      }
      function searchSheetHTML() {
        const d = detectedHTML();
        return `${d ? `<div><h3>Understood</h3>${d}</div>` : ''}
    <div><h3>Filter by</h3><div class="chips">
      <button class="btn btn-soft" data-add-filter="type" type="button">${ico.type} Type</button>
      <button class="btn btn-soft" data-add-filter="date" type="button">${ico.cal} Date</button>
      <button class="btn btn-soft" data-add-filter="collection" type="button">${ico.folderSm} Collection</button>
      ${S.filters.map(chipHTML).join('')}
    </div></div>
    ${S.text ? '' : `<div><h3>Try typing</h3><div class="suggest">${['videos from the last two months', '2 months ago to last month', 'canvases in Brand work', 'pricing websites'].map((s) => `<button class="btn" data-try="${s}" type="button">${s}</button>`).join('')}</div></div>`}`;
      }
      function addMenuHTML() {
        const here = S.scope ? colById(S.scope).name : 'Library';
        return `<div style="display:grid;gap:2px">
    <button class="menu-item" data-add="upload">${ico.upload} Upload images <small>to ${esc(here)}</small></button>
    <button class="menu-item" data-add="canvas">${ico.board.replace(/14/g, '16')} New canvas <small>opens the studio</small></button>
    <button class="menu-item" data-add="folder">${ico.folderSm.replace(/14/g, '16')} ${S.scope ? 'New folder here' : 'New collection'}</button>
  </div>`;
      }

      /* ---------- folder manager (columns, like Finder) ---------- */
      function folderManagerHTML() {
        const path = S.scope ? ancestors(S.scope).map((a) => a.id) : [];
        const cols = [null, ...path];
        return `<div class="fm-cols">${cols
          .map(
            (pid) => `<div class="fm-col">
      <div class="fm-list">
        ${pid === null ? `<div class="fm-row" ${!S.scope ? 'aria-current="true"' : ''}><button class="fm-go" data-fm-go=""><span class="name">All sources</span><span class="count num">${SOURCES.length}</span></button></div>` : ''}
        ${children(pid).map(fmRowHTML).join('')}
        ${pid !== null && !children(pid).length ? '<p class="muted" style="margin:6px 10px;font-size:13px">No folders inside yet.</p>' : ''}
      </div>
      <div class="fm-foot"><button class="fm-go" data-fm-new="${pid || ''}" style="color:var(--muted-fg)">${ico.plusSm}<span class="name">${pid ? 'New folder' : 'New collection'}</span></button></div>
    </div>`,
          )
          .join('')}</div>
    <p class="fm-hint">Click to open · drag a card onto a folder to add it · pencil to rename, bin to delete</p>`;
      }
      function fmRowHTML(c) {
        const path = S.scope ? ancestors(S.scope).map((a) => a.id) : [];
        if (S.fm.editing === c.id)
          return `<div class="fm-row"><form class="fm-edit" data-fm-rename="${c.id}"><label class="sr-only" for="fm-in">Folder name</label><input id="fm-in" value="${esc(c.name)}" maxlength="100" required autocomplete="off"><button class="btn btn-primary" style="height:30px">Save</button></form></div>`;
        if (S.fm.confirm === c.id) {
          const n = branchIds(c.id).length - 1;
          return `<div class="fm-row"><div class="fm-confirm" role="alertdialog" aria-label="Delete ${esc(c.name)}"><p>Delete “${esc(c.name)}”${n ? ` and ${plural(n, 'folder')} inside` : ''}? Sources saved only here go to the trash.</p><div><button class="btn btn-danger" data-fm-delete="${c.id}">Delete</button><button class="btn" data-fm-cancel>Cancel</button></div></div></div>`;
        }
        return `<div class="fm-row" data-drop-col="${c.id}" ${path.includes(c.id) ? 'aria-current="true"' : ''}>
    <button class="fm-go" data-fm-go="${c.id}" title="${esc(c.name)}"><span class="dot" style="background:${dotColor(c)}"></span><span class="name">${esc(c.name)}</span><span class="count num">${countIn(c.id)}</span>${children(c.id).length ? ico.chev : '<span style="width:14px"></span>'}</button>
    <button class="fm-act" data-fm-edit="${c.id}" aria-label="Rename ${esc(c.name)}">${ico.pencil}</button>

      }
      function createFolder(pid) {

          color: null,
        };
        COLLECTIONS = [...COLLECTIONS, c];
        return c;
      }
      function renameCollection(id, name) {
        COLLECTIONS = COLLECTIONS.map((c) =>
          c.id === id ? { ...c, name } : c,
        );
        update();
      }
      function deleteCollection(id) {
        const ids = new Set(branchIds(id));
        const parent = colById(id).parentId;
        COLLECTIONS = COLLECTIONS.filter((c) => !ids.has(c.id));
        SOURCES = SOURCES.map((s) => ({
          ...s,
          collectionIds: s.collectionIds.filter((x) => !ids.has(x)),
        }));
        cardCache.clear();
        if (S.scope && ids.has(S.scope)) S.scope = parent;
        S.filters = S.filters.filter((f) => f.kind !== 'col' || colById(f.cid));
      }
      function addToCollection(sid, cid) {

          x.id === sid ? { ...x, collectionIds: [...x.collectionIds, cid] } : x,

        update();
      }

      /* =====================================================================
   AI — sessions are shared; each variant only changes how you pick one
   ===================================================================== */
      const placeOf = () =>
        S.page === 'studio' ? S.canvasId : S.scope || 'library';
      function placeLabel(p) {
        if (p === 'library') return { icon: ico.library, label: 'Library' };
        const s = byId(p);
        if (s) return { icon: ico.board.replace(/14/g, '12'), label: s.name };
        const c = colById(p);
        return {
          icon: ico.folderSm.replace(/14/g, '12'),
          label: c ? c.name : 'Deleted folder',
        };
      }
      const placeHTML = (p) => {
        const l = placeLabel(p);
        return `<span class="place">${l.icon}<span>${esc(l.label)}</span></span>`;
      };
      const session = () => SESSIONS.find((x) => x.id === S.activeSession);
      const sortedSessions = () =>
        [...SESSIONS].sort((a, b) => b.updated - a.updated);
      function chatPlaceholder() {
        if (S.page === 'studio')
          return 'Ask about this canvas or your library…';
        return S.scope
          ? `Ask about ${colById(S.scope).name}…`
          : 'Ask about your library…';
      }

      function msgHTML(m, i) {
        if (m.role === 'user')
          return `<div class="msg-user">${esc(m.text)}</div>`;
        const words = m.full.split(' ');
        const finished = m.shown >= words.length;
        const ids = m.ids.slice(0, 6);
        const more = m.ids.length - ids.length;
        const acts = [...m.actions];
        if (finished && m.ids.length && !m.made) {
          if (m.filters.length || m.rest)
            acts.push({ a: 'show', label: 'Show in library' });
          acts.push(
            S.page === 'studio'
              ? { a: 'add', label: 'Add to this canvas' }
              : { a: 'canvas', label: 'Make a canvas from these' },
          );
        }
        return `<div class="msg-ai"><span class="who">${ico.spark} Mado</span>
    <p>${esc(words.slice(0, m.shown).join(' '))}${finished ? '' : '<span class="caret" aria-hidden="true"></span>'}</p>
    ${
      finished && ids.length
        ? `<div class="cites">${ids
            .map((id) => {
              const s = byId(id);
              return s
                ? `<button class="cite" data-open="${id}" aria-label="Open ${esc(s.name)}"><img src="${imgUrl(s.kind === 'canvas' ? byId(s.items[0]?.sid || 's1') : s, 120)}" alt=""></button>`
                : '';
            })
            .join(
              '',
            )}${more > 0 ? `<span class="num muted" style="font-size:12px">+${more}</span>` : ''}</div>`
        : ''
    }
    ${finished && acts.length ? `<div class="msg-actions">${acts.map((a) => `<button class="btn btn-soft" data-ai="${a.a}" data-mi="${i}" ${a.id ? `data-id="${a.id}"` : ''}>${esc(a.label)}</button>`).join('')}</div>` : ''}
  </div>`;
      }
      const SUGGEST = () =>
        S.page === 'studio'
          ? [
              'Is this direction too safe?',
              'Find warm packaging from the last two months',
              'What is missing from this board?',
            ]
          : [
              'Images from the last two months',
              'What do my Nike sources have in common?',

      function logHTML(sess, emptyText) {

            .map(
              (s) =>
                `<button class="btn btn-soft" data-suggest="${esc(s)}">${esc(s)}</button>`,

      }
      function afterChatRender() {
        const b = $('[data-chat-scroll]');

      }
      function refreshChat() {
        if (S.sheet === 'chat') {
          $('[data-sheet]').innerHTML = variant.chatHTML();
          afterChatRender();
        }
      }

      function newSession() {
        S.activeSession = null;
        S.draftNew = true;
        refreshChat();
        $('#dq').focus();
      }
      function ask(q) {
        q = q.trim();
        if (!q) return;
        let sess = session();
        if (!sess) {
          sess = {
            id: nid('a'),
            title: q.length > 48 ? `${q.slice(0, 46)}…` : q,
            place: placeOf(),
            updated: new Date(NOW),
            messages: [],
          };
          SESSIONS = [...SESSIONS, sess];
          S.activeSession = sess.id;
        }
        S.draftNew = false;
        const msg = { role: 'ai', shown: 0, ...aiReply(q) };
        sess.messages = [...sess.messages, { role: 'user', text: q }, msg];
        sess.updated = new Date(NOW.getTime() + uid * 1000);
        const total = msg.full.split(' ').length;
        if (reduceMotion) msg.shown = total;
        refreshChat();
        if (reduceMotion) return;
        const t = setInterval(() => {
          msg.shown += 1;
          if (msg.shown >= total) clearInterval(t);
          if (S.activeSession === sess.id) refreshChat();
        }, 28);
      }
      function aiReply(q) {
        const p = parseQuery(q);
        const words = keywords(p.rest);
        const canvas = S.page === 'studio' ? byId(S.canvasId) : null;
        if (
          canvas &&
          /\b(this|board|canvas|direction|missing|safe)\b/i.test(q) &&
          !/\b(find|show)\b/i.test(q)
        ) {
          return {
            full: `This board has ${plural(canvas.items.length, 'source')}${canvas.notes.length ? ` and ${plural(canvas.notes.length, 'note')}` : ''}. They are calm, close-up and warm. What's missing is contrast: one loud image or a type sample would show the client where the edge is.`,
            ids: canvas.items.map((i) => i.sid),
            actions: [],
            filters: [],
            rest: '',
            made: true,
          };
        }
        const pool = filterSources({
          filters: p.filters,
          scope: S.page === 'studio' ? null : S.scope,
        }).filter((s) => s.kind !== 'canvas');
        let hits = words.length
          ? pool.filter((s) => words.some((w) => hay(s).includes(w)))
          : pool;
        if (/warm/i.test(q))
          hits = [
            ...new Set([
              ...hits,
              ...pool.filter((s) =>
                /kraft|orange|warm|sunset|ceramic|linen|wood|paper/i.test(
                  s.name,
                ),
              ),
            ]),
          ].sort((a, b) => b.date - a.date);
        if (!hits.length) hits = pool;
        hits = hits.slice(0, 8);
        const t = p.filters.find((f) => f.kind === 'type'),
          d = p.filters.find((f) => f.kind === 'date');
        const noun = (n) =>
          t
            ? t.kinds
                .map((k) =>
                  (n === 1 ? KIND_ONE[k] : KIND_LABEL[k]).toLowerCase(),
                )
                .join(' and ')
            : n === 1
              ? 'source'
              : 'sources';
        const tail = d
          ? ` from ${d.label.charAt(0).toLowerCase()}${d.label.slice(1)}`
          : '';
        if (!hits.length)
          return {
            full: `I couldn't find any ${noun(2)}${tail}. Try a wider date range or another collection.`,
            ids: [],
            actions: [],
            filters: p.filters,
            rest: '',
          };
        if (
          /\b(make|create|build|start)\b/i.test(q) &&
          /\b(canvas|board|moodboard)/i.test(q)
        ) {
          const c = createCanvas(
            hits.slice(0, 6),
            `${words.length ? words.join(' ').replace(/^\w/, (x) => x.toUpperCase()) : 'New'} — draft`,
          );
          return {
            full: `I made a canvas with ${plural(c.items.length, 'source')}${tail}. It's saved in your library like any other source. It's only a starting point — move things around or remove what doesn't fit.`,
            ids: c.items.map((x) => x.sid),

            filters: p.filters,
            rest: '',
            made: true,

        const common = /common|share|similar/i.test(q)

          full: `${n === 1 ? 'One' : n} ${noun(n)}${tail} match. “${hits[0].name}” is the closest.${common}`,

          actions: [],
          filters: p.filters,
          rest: words.join(' '),

      }
      function createCanvas(sources, name) {

          id: nid('k'),
          name,
          kind: 'canvas',
          date: new Date(NOW.getTime() + uid * 1000),
          collectionIds: S.scope ? [S.scope] : [],
          w: 4,
          h: 3,
          items,
          notes: [],
        };
        SOURCES = [c, ...SOURCES];
        return c;
      }

      /* ---------- Variant A · Tabs: open chats as tabs; older ones in a menu ---------- */
      const TABS = {
        open: [],
        enter() {
          if (!this.open.length)
            this.open = sortedSessions()
              .slice(0, 3)
              .map((s) => s.id);
          if (!S.activeSession && !S.draftNew)
            S.activeSession = this.open[0] || null;
          if (!S.activeSession) S.draftNew = true;
        },
        chatHTML() {
          if (S.activeSession && !this.open.includes(S.activeSession))
            this.open = [S.activeSession, ...this.open];

            .map((id) => SESSIONS.find((s) => s.id === id))
            .filter(Boolean);

            (s) => !this.open.includes(s.id),
